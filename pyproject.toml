[project]
name = "ly-generator"
version = "0.1.0"
description = "Generador modular de Layouts de Pago (Gastos fijos, Proveedores, Devoluciones, Viaticos)"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pdfplumber>=0.11", "pypdfium2>=4.30", "pytesseract>=0.3.10", "Pillow>=10"]

[project.scripts]
lygen = "lygen.cli:main"

[tool.setuptools.packages.find]
include = ["lygen*"]
